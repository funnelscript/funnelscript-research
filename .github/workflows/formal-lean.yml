name: Lean formal verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal:
    name: Build machine-checked kernel theorems
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Lean toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and check theorems
        run: "$HOME/.elan/bin/lake build"
      - name: Reject holes and custom axioms
        run: |
          if grep -RnE '\b(sorry|admit)\b|^[[:space:]]*axiom[[:space:]]' Formal.lean Formal/; then
            echo 'Untrusted proof construct detected'
            exit 1
          fi
